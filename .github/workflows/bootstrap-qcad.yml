name: Bootstrap from QCAD Community Edition

on:
  push:
    paths:
      - '.github/workflows/bootstrap-qcad.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basidraft-bootstrap
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout BasiDraft
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import QCAD Community Edition 3.33.1 source tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          QCAD_COMMIT="1bf8d0c6f83b7bb034cfd62b7346255370b9ddca"
          TMP_DIR="$(mktemp -d)"

          git -C "$TMP_DIR" init
          git -C "$TMP_DIR" remote add origin https://github.com/qcad/qcad.git
          git -C "$TMP_DIR" fetch --depth=1 origin "$QCAD_COMMIT"
          git -C "$TMP_DIR" checkout --detach FETCH_HEAD

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$TMP_DIR/" "$GITHUB_WORKSPACE/"

          cat > "$GITHUB_WORKSPACE/BASIDRAFT.md" <<'EOF'
          # BasiDraft

          BasiDraft is developed directly from the QCAD Community Edition source tree.

          Upstream baseline: qcad/qcad commit 1bf8d0c6f83b7bb034cfd62b7346255370b9ddca (QCAD 3.33.1).

          Development principles:
          - modify the original CAD source tree directly, not a parallel reimplementation;
          - Windows x64 is the primary target;
          - Russian is the primary UI language;
          - preserve upstream GPLv3 and all third-party license notices;
          - first establish a reproducible clean build, then simplify the UI and add BasiDraft automation.
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo "QCAD source tree is already imported."
          else
            git commit -m "Import QCAD Community Edition 3.33.1 source tree"
            git push origin HEAD:main
          fi

      - name: Verify imported QCAD tree
        shell: bash
        run: |
          set -euo pipefail
          test -d src
          test -d scripts
          test -f README.md
          test -f src/core/RVersion.h
          grep -q 'R_QCAD_VERSION_STRING "3.33.1"' src/core/RVersion.h
          echo "QCAD 3.33.1 source tree imported successfully."
