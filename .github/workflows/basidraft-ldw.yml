name: BasiDraft LDW

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: basidraft-ldw-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LDW reader tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            src/basidraft/ldw/LdwReader.cpp \
            src/basidraft/geometry/GeometryFingerprint.cpp \
            src/basidraft/tests/LdwReaderTests.cpp \
            -Isrc/basidraft \
            -o /tmp/basidraft-ldw-tests
      - name: Run LDW reader tests
        run: /tmp/basidraft-ldw-tests

  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev
      - name: Configure QCAD / BasiDraft
        run: cmake -S . -B build -G Ninja -DBUILD_QT6=ON
      - name: Build LDW plugin and importer integration test
        run: cmake --build build --target basidraftldw basidraft_ldw_integration_test --parallel 2
      - name: Run end-to-end LDW importer test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/plugins:${{ github.workspace }}/debug:${{ github.workspace }}/release
        run: ./build/tests/basidraft_ldw_integration_test

  script-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 runtime / build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev
      - name: Configure QCAD / BasiDraft
        run: cmake -S . -B build -G Ninja -DBUILD_QT6=ON
      - name: Build QCAD executable and LDW plugin
        run: cmake --build build --target qcad basidraftldw --parallel 2
      - name: Verify automatic overall dimensions in QCAD runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./debug/qcad-bin \
            -no-gui \
            -no-show \
            -exec scripts/Developer/BasiDraft/BasiDraftScriptSmoke.js \
            -quit
